services:
  - type: worker
    name: anvil
    runtime: node
    plan: starter
    buildCommand: >-
      npm install &&
      (test -d "$TARGET_REPO_PATH/.git" || (rm -rf "$TARGET_REPO_PATH" && git clone --depth 1 "$TARGET_REPO_GIT_URL" "$TARGET_REPO_PATH")) &&
      (cd "$TARGET_REPO_PATH" && npm install)
    startCommand: node daemon.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TARGET_REPO_GIT_URL
        sync: false
      - key: TARGET_REPO_PATH
        value: /opt/render/project/target-repo

  # Dogfood instance: same worker, pointed at a *separate clone* of Anvil's
  # own repo instead of NexusMem. Safe by construction, not just by
  # discipline — TARGET_REPO_PATH here is a fresh `git clone` under
  # /opt/render/project/target-repo, a different directory than wherever
  # this service's own daemon.js actually runs from, so the self-target
  # guard in daemon.js (TARGET_REPO_PATH === ANVIL_ROOT) never trips. And
  # since .env/GEMINI_API_KEY is gitignored and never committed, the cloned
  # copy can't contain the secret that a real self-target previously lost
  # (see the "Refuse to start" commit). Runs as its own independent process,
  # so a stuck or misbehaving dogfood cycle can't affect the NexusMem one.
  - type: worker
    name: anvil-dogfood
    runtime: node
    plan: starter
    buildCommand: >-
      npm install &&
      (test -d "$TARGET_REPO_PATH/.git" || (rm -rf "$TARGET_REPO_PATH" && git clone --depth 1 "$TARGET_REPO_GIT_URL" "$TARGET_REPO_PATH")) &&
      (cd "$TARGET_REPO_PATH" && npm install)
    startCommand: node daemon.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TARGET_REPO_GIT_URL
        value: https://github.com/yaminbkk/anvil.git
      - key: TARGET_REPO_PATH
        value: /opt/render/project/target-repo
